name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  # 手动入口：只跑 check 与 ARM64 构建校验，不产出 Release。
  # 用途是在真正打 tag 前先验证 arm64 runner 与 SDL2 依赖是否可用。
  workflow_dispatch:

# 四道门：格式 → 静态分析 → 测试（含 -race）→ 构建。
# vendor/ 已入仓：构建不依赖 proxy.golang.org（设备/CI 都可能没有外网）。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ui 包链接 SDL2（textrender 走 SDL_ttf）；测试也要 fonts 提供真实字体
      - name: 安装 SDL2 与 CJK 字体
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-ttf-dev fonts-noto-cjk

      - name: gofmt
        run: |
          test -z "$(gofmt -l internal cmd)" || {
            echo "以下文件未格式化:"; gofmt -l internal cmd
            echo "--- 差异（前 120 行）---"
            gofmt -d internal cmd | head -120
            exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./internal/...

      - name: go test -race（并发修复回归）
        run: go test -race -count=1 ./internal/config/ ./internal/hardware/ ./internal/screen/ ./internal/web/ ./internal/execx/

      - name: build（注入版本号，与 Makefile 同口径）
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o build/r1-toolbox ./cmd

  build-arm64:
    # 在**原生 arm64 runner** 上编译，而不是 x86 交叉编译。
    # 历史教训：曾用 gcc-aarch64-linux-gnu 交叉编译，但 x86 runner 没有 arm64
    # 软件源，`apt install libsdl2-dev:arm64` 直接 "Unable to locate package"；
    # apt 是原子操作，连带把 gcc-aarch64-linux-gnu 一起回滚，于是编译器根本
    # 不存在。更糟的是那句 `|| true` 把整单失败吞掉，构建步骤再 `|| echo`
    # 吞一次，job 一路绿灯却没有产物。现在：原生 arm64 + 不吞错。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 安装 SDL2（arm64 原生源，失败即失败）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev libsdl2-ttf-dev

      - name: 构建 linux/arm64
        run: |
          VERSION=${GITHUB_REF_NAME}
          COMMIT=$(git rev-parse --short HEAD)
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
            -o build/r1-toolbox-linux-arm64 ./cmd

      # 没有产物就直接失败，不留"绿着但没东西"的状态
      - name: 校验产物（架构 / 可执行 / 动态库可解析）
        run: |
          test -x build/r1-toolbox-linux-arm64
          file build/r1-toolbox-linux-arm64
          file build/r1-toolbox-linux-arm64 | grep -q 'ARM aarch64'
          ldd build/r1-toolbox-linux-arm64 | grep -q 'libSDL2'
          ls -lh build/r1-toolbox-linux-arm64

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/r1-toolbox-linux-arm64
          generate_release_notes: true
